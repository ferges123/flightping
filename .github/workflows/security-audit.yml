name: Security audit

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project and audit tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          python -m pip install 'pip-audit>=2.10,<3'
      - name: Audit dependencies
        run: python -m pip_audit --skip-editable
      - name: Run tests
        run: python -m pytest -q
