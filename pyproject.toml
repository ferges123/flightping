[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flightpingbot"
version = "0.1.0"
description = "Private Telegram bot for FlightAware flight delay monitoring"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.10,<4",
  "aiosqlite>=0.20,<1",
  "httpx>=0.27,<1",
  "python-dotenv>=1,<2",
  "cryptography>=50,<51",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
